name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@9d7150bc8a3dae8149739a88019d192b579ad90c # v1.0.193
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The trailing --append-system-prompt makes the reviewer emit a machine-readable verdict
          # the autonomous merge gate (kga-api-factory-merge-actions, KGA-337) reads: a review that
          # ends "VERDICT: REQUEST_CHANGES" hard-blocks the merge. claude-code-action cannot submit a
          # FORMAL GitHub review (APPROVE/REQUEST_CHANGES) — that is a documented hard limitation — so
          # this comment marker is the only channel a blocking @claude review can use. Augments the
          # comment-triggered Assistant (no fixed prompt:) rather than replacing it.
          claude_args: |
            --model claude-sonnet-5
            --append-system-prompt "When reviewing a pull request, end your review with a final line that is exactly one of: VERDICT: APPROVE (no blocking issues, safe to merge) or VERDICT: REQUEST_CHANGES (blocking issues that must be fixed before merge). Include this line on every review, re-reviews included; it is read by the autonomous merge gate, where VERDICT: REQUEST_CHANGES blocks the merge. Omit this line for non-review interactions."

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

