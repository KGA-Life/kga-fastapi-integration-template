[project]
name = "kga-fastapi-integration-template"
version = "0.1.0"
description = "Template FastAPI service for a KGA Life third-party integration API (provider-agnostic starting point)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.13.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.uv]
# Pin the exact uv version, so the local dev loop and CI run byte-for-byte the
# same tool. `astral-sh/setup-uv` reads this `required-version` from the repo
# root before doing anything else, so CI installs exactly this version and never
# calls the GitHub API to resolve "latest" — which is both non-reproducible and
# fails CI during a GitHub API outage (KGA-143). uv itself also enforces this
# locally, keeping everyone in lockstep. To adopt a newer uv, bump this line
# together (in one commit) with the version noted in README.md AND the uv base
# image tag in the Dockerfile (ghcr.io/astral-sh/uv:<version>-python3.14-...),
# or the Docker build will fail this exact check once its bundled uv drifts.
required-version = "==0.10.11"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts callables in argument defaults
# (`x = Depends(...)`, `q = Query(...)`). These are the framework's intended
# pattern, not the B008 mutable-default footgun, so treat them as immutable.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.Security",
    "fastapi.File",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage runs on every pytest invocation (local loop == CI), and the run FAILS
# below the floor as well as on any test failure — this is what makes CI-green a
# load-bearing signal for the autonomous merge gate rather than "a trivial assert
# passed". The floor is deliberately tunable per repo (see the coverage config
# below): 80 is the KGA starting value; this template sits comfortably above it.
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["app"]
# The `app/example/**` package is the deliberately-minimal PLACEHOLDER integration
# every generated repo replaces (see app/config.py: "rename example throughout to
# the provider"). It is excluded from the coverage floor so the template's own CI
# is green on its real, governance-critical core (config, main, routers, models),
# not on throwaway example scaffolding. When you build a concrete service you
# rename `app/example/` to `app/<provider>/` — this pattern then matches nothing,
# so your REAL integration code IS measured against the floor. Keep the 80 floor;
# narrow this omit only to any remaining scaffolding.
#
# DECISION (T16): KEEP `app/example/` as the minimal single-provider reference
# that preserves the "generate a new integration / copy-a-folder" factory story;
# the `app/domains/finance/` gateway is the richer worked example alongside it.
# Both stay mounted. Only the replaceable `app/example/` placeholder is omitted —
# `app/auth/**` and `app/domains/**` are real gateway code and are deliberately
# NOT omitted, so they ARE measured against the floor (their tests land next batch).
omit = ["app/example/*"]

[tool.coverage.report]
show_missing = true
